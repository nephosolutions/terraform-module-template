---
# Pull requests are squash-merged, so the PR title becomes the commit message that release-please reads.
# Required check: "PR Title".
name: PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      # Reads only the PR title through the API; it never checks out the PR's code.
      - name: Check the title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
