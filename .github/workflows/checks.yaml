---
# Static checks of the module. They mirror tfc-organization's shared workflows terraform-checks.yaml and
# yaml-lint.yaml (same actions, pins and job names). Module repositories are public and tfc-organization is private,
# and a public repository can't call reusable workflows from a private one. Once the shared workflows live in a public
# repository, replace these jobs with calls to them, pinned by SHA.
#
# Required checks in branch protection: "Terraform Checks" and "YAML Lint". No `paths` filter: a required check that
# doesn't run blocks the PR.
name: Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.17.1

jobs:
  fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check that the Terraform code is formatted
        run: terraform fmt -check -diff -recursive

  validate:
    name: Validate (${{ matrix.terraform_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The current version, and the oldest one callers run. Keep the second entry at the module's minimum supported
        # Terraform version, but not below 1.7, the first that runs terraform test with mocked providers. Callers'
        # workspaces often run older versions than CI, and older versions (1.7.0 at least) evaluate both sides of || and
        # &&: a validation like `var.x == null || contains(..., var.x)` passes on the current version and fails there.
        terraform_version:
          - 1.17.1
          - 1.7.0
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - name: terraform init (without backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform test
        run: |
          if compgen -G 'tests/*.tftest.hcl' > /dev/null || compgen -G '*.tftest.hcl' > /dev/null; then
            terraform test
          else
            echo "No tests"
          fi

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: tflint
        run: tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl" -f compact

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: Lint YAML
        run: yamllint .

  # The required Terraform check: fails unless every Terraform job succeeded.
  result:
    name: Terraform Checks
    needs: [fmt, validate, tflint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every check succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::fmt: ${{ needs.fmt.result }}, validate: ${{ needs.validate.result }}," \
            "tflint: ${{ needs.tflint.result }}"
          exit 1
